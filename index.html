<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#cc3300"/>
  <title>Oops!</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta property="og:title" content="Oops! – Platformer Game" />
  <meta property="og:description" content="A deceptive, trap-filled multiverse platformer game where trust is your biggest weakness 😇" />
  <meta property="og:image" content="https://oops-snowy-three.vercel.app/logo.png" />
  <meta property="og:url" content="https://oops-snowy-three.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oops! – Platformer Game" />
  <meta name="twitter:description" content="A totally fair multiverse platformer game 😇" />
  <meta name="twitter:image" content="https://oops-snowy-three.vercel.app/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=4.2.0"/>
</head>
<body>
  <div id="game-container"></div>

  <!-- Responsive On-Screen Mobile Gamepad -->
  <div id="mobile-gamepad" class="hidden">
    <div class="touch-cluster-left">
      <button type="button" id="btn-left" class="gamepad-btn gamepad-btn-dir" aria-label="Move Left">◀</button>
      <button type="button" id="btn-right" class="gamepad-btn gamepad-btn-dir" aria-label="Move Right">▶</button>
    </div>
    <div class="touch-cluster-right">
      <button type="button" id="btn-restart" class="gamepad-btn gamepad-btn-restart" aria-label="Restart Level">↺</button>
      <button type="button" id="btn-flip" class="gamepad-btn gamepad-btn-flip hidden" aria-label="Flip Gravity">⇄</button>
      <button type="button" id="btn-jump" class="gamepad-btn gamepad-btn-jump" aria-label="Jump">
        <span>▲</span>
        <span class="btn-subtext">JUMP</span>
      </button>
    </div>
  </div>

  <!-- Offline Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=4.2.0').then(reg => {
        reg.update();
      }).catch(()=>{});
    }
  </script>
  <!-- Phaser 3 Engine (Local + CDN Fallback) -->
  <script src="phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\\/script>');
    }
  </script>
  <script src="game.js?v=4.2.0"></script>
</body>
</html>
