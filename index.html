<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#cc3300"/>
  <title>Oops!</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=4.1.0"/>
</head>
<body>
  <div id="game-container"></div>

  <!-- Offline Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=4.1.0').then(reg => {
        reg.update();
      }).catch(()=>{});
    }
  </script>
  <!-- Phaser 3 Engine (Local + CDN Fallback) -->
  <script src="phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\\/script>');
    }
  </script>
  <script src="game.js?v=4.1.0"></script>
</body>
</html>
