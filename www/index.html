<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#cc3300"/>
  <title>Oops!</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta property="og:title" content="Oops! – Platformer Game" />
  <meta property="og:description" content="A deceptive, trap-filled multiverse platformer game where trust is your biggest weakness 😇" />
  <meta property="og:image" content="https://oops-snowy-three.vercel.app/logo.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:url" content="https://oops-snowy-three.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oops! – Platformer Game" />
  <meta name="twitter:description" content="A totally fair multiverse platformer game 😇" />
  <meta name="twitter:image" content="https://oops-snowy-three.vercel.app/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"/></noscript>
  <link rel="stylesheet" href="style.css?v=5.0.0"/>
</head>
<body>
  <!-- Rotate Device Prompt for Portrait Mode -->
  <div id="rotate-prompt">
    <div class="rotate-phone-anim">📱</div>
    <div class="rotate-title">ROTATE DEVICE</div>
    <div class="rotate-desc">Rotate to landscape for full-screen gameplay!</div>
  </div>

  <!-- High-Speed Progressive Splash Loader (Removed upon game load) -->
  <div id="game-loader">
    <div class="loader-card">
      <div class="loader-logo">Oops!</div>
      <div class="loader-tagline">A TOTALLY FAIR MULTIVERSE</div>
      <div class="loader-bar-wrap">
        <div id="loader-bar-fill" class="loader-bar-fill"></div>
      </div>
      <div id="loader-status" class="loader-status">STARTING ENGINE (20%)...</div>
    </div>
  </div>

  <div id="game-container"></div>

  <!-- In-Game Player Feedback & Bug Report Modal -->
  <div id="feedback-modal" class="modal-overlay hidden" style="display: none !important;">
    <div class="feedback-modal-card">
      <div class="modal-header">
        <div class="modal-title">💬 PLAYER REPORT &amp; FEEDBACK</div>
        <button type="button" id="btn-close-feedback" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <p class="modal-desc">Share your opinion, report a bug, or suggest improvements directly to GitHub!</p>

      <form id="feedback-form">
        <div class="form-row">
          <label for="fb-category">Category</label>
          <select id="fb-category" class="feedback-input">
            <option value="💡 Suggestion / Idea">💡 Suggestion / Improvement Idea</option>
            <option value="🐛 Bug Report">🐛 Bug Report / Glitch</option>
            <option value="⚖️ Level Difficulty">⚖️ Level Difficulty Balance</option>
            <option value="🎨 Visual &amp; Sound">🎨 Visual &amp; Audio Feedback</option>
            <option value="⭐ General Feedback">⭐ General Feedback</option>
          </select>
        </div>

        <div class="form-row">
          <label for="fb-name">Your Name / Nickname</label>
          <input type="text" id="fb-name" class="feedback-input" placeholder="e.g. NinjaMaster (optional)" maxlength="40" />
        </div>

        <div class="form-row">
          <label for="fb-message">Your Feedback / Improvement Idea</label>
          <textarea id="fb-message" class="feedback-textarea" rows="3" placeholder="Tell us what you liked, what felt unfair, or how to make Oops! even better..." required></textarea>
        </div>

        <!-- Image / Screenshot Attachment Section -->
        <div class="form-row">
          <label>Attach Screenshot / Image (Optional)</label>
          <div class="fb-attach-row">
            <label for="fb-image-input" class="fb-attach-btn">
              📁 Choose File
            </label>
            <input type="file" id="fb-image-input" accept="image/*" class="fb-hidden-file" />
            
            <button type="button" id="btn-snap-screen" class="fb-attach-btn fb-snap-btn">
              📸 Snap Game
            </button>
          </div>

          <div id="fb-preview-container" class="fb-preview-box hidden">
            <img id="fb-preview-img" src="" alt="Screenshot preview" />
            <div class="fb-preview-info">
              <span id="fb-preview-name" class="fb-preview-text">screenshot.png</span>
              <button type="button" id="btn-remove-preview" class="fb-remove-btn" title="Remove image">✕</button>
            </div>
          </div>
        </div>

        <div class="fb-meta-info" id="fb-meta-info">
          📍 Game Context: <span id="fb-curr-world">World 1</span> · <span id="fb-curr-level">Level 1</span> · 💀 <span id="fb-curr-deaths">0</span> Deaths
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-feedback" class="fb-btn-cancel">Cancel</button>
          <button type="submit" id="btn-submit-feedback" class="fb-btn-submit">🚀 Submit to GitHub</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Responsive On-Screen Mobile Gamepad -->
  <div id="mobile-gamepad" class="hidden" style="display: none !important;">
    <div class="touch-cluster-left">
      <button type="button" id="btn-left" class="gamepad-btn gamepad-btn-dir" aria-label="Move Left">◀</button>
      <button type="button" id="btn-right" class="gamepad-btn gamepad-btn-dir" aria-label="Move Right">▶</button>
    </div>
    <div class="touch-cluster-right">
      <button type="button" id="btn-restart" class="gamepad-btn gamepad-btn-restart" aria-label="Restart Level">↺</button>
      <button type="button" id="btn-flip" class="gamepad-btn gamepad-btn-flip hidden" aria-label="Flip Gravity">⇄</button>
      <button type="button" id="btn-jump" class="gamepad-btn gamepad-btn-jump" aria-label="Jump">
        <span>▲</span>
        <span class="btn-subtext">JUMP</span>
      </button>
    </div>
  </div>

  <!-- High-Speed Progressive Loader & Clean Service Worker Lifecycle -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      }).catch(function(){});
    }

    (function() {
      var bar = document.getElementById('loader-bar-fill');
      var txt = document.getElementById('loader-status');
      function setProgress(pct, msg) {
        if (bar) bar.style.width = pct + '%';
        if (txt) txt.textContent = msg + ' (' + pct + '%)';
      }

      function loadScript(src, onSuccess, onError) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = onSuccess;
        s.onerror = onError;
        document.head.appendChild(s);
      }

      setProgress(25, 'CONNECTING ENGINE');

      // 1. Try Cloudflare Edge CDN first (Brotli compressed ~280KB, worldwide edge caching)
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js', function() {
        setProgress(70, 'LOADING MULTIVERSE WORLDS');
        loadScript('game.js?v=5.3.0', function() {
          setProgress(100, 'READY!');
        });
      }, function() {
        // 2. Failover to local phaser.min.js if CDN is blocked or offline
        setProgress(50, 'LOADING LOCAL ENGINE');
        loadScript('phaser.min.js', function() {
          setProgress(85, 'LOADING MULTIVERSE WORLDS');
          loadScript('game.js?v=5.3.0', function() {
            setProgress(100, 'READY!');
          });
        }, function() {
          setProgress(100, 'STARTING...');
        });
      });
    })();
  </script>
</body>
</html>
